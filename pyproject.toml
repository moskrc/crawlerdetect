[project]
name = "crawlerdetect"
version = "0.4.2"
description = "CrawlerDetect is a Python library designed to identify bots, crawlers, and spiders by analyzing their user agents."
authors = [{ name = "Vitalii Shishorin", email = "moskrc@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <4"
keywords = ["crawler",
    "crawler detect",
    "crawler detector",
    "crawlerdetect",
    "python crawler detect", ]
dependencies = []

[project.urls]
Homepage = "https://github.com/moskrc/crawlerdetect"
Repository = "https://github.com/moskrc/crawlerdetect"
Documentation = "https://github.com/moskrc/crawlerdetect"

[project.scripts]
crawlerdetect = "crawlerdetect.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17",
    "pre-commit>=4.6.1,<5",
    "bump-my-version>=1.5.0,<2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", ]

[tool.ruff]
line-length = 120
# don't format these files (they are auto-generated)
exclude = [
    "crawlerdetect/providers/crawlers.py",
    "crawlerdetect/providers/excluduins.py",
    "crawlerdetect/providers/headers.py",
    "tests/fixtures/sec_ch_ua/*",
    "tests/fixtures/user_agents/*",
]


[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "N", # PEP8 naming
    "UP", # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
    "N802", # function name should be lowercase
    "N806", # variable in function should be lowercase
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.bumpversion]
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""
current_version = "0.4.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
setup_hooks = []
pre_commit_hooks = ["uv lock", "git add uv.lock"]
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "crawlerdetect/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.hatch.build.targets.sdist]
include = [
    "/crawlerdetect",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
